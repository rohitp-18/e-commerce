name: "app"
services:
  server:
    image: node:20
    container_name: server
    ports:
      - "5000:5000"
    working_dir: ./
    volumes:
      - ./
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongoadmin:password@mongodb
    env_file:
      - ./back/config/.env
    command: sh -c "npm install && npm run back"

  client:
    image: node:20
    container_name: client
    working_dir: /front
    volumes:
      - ./front:/app
    ports:
      - "3000:3000"
    command: sh -c "cd /app && npm install && npm start"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27010:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
